name: CamControl
options:
  bundleIdPrefix: net.codecrete
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 4H9ZA7X4C4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    STRING_CATALOG_GENERATE_SYMBOLS: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true

targets:
  CamControl:
    type: application
    platform: macOS
    sources:
      - path: CamControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.codecrete.CamControl
        PRODUCT_NAME: CamControl
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1000"
        INFOPLIST_FILE: CamControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: CamControl/CamControl.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: IOKit.framework
      - sdk: CoreFoundation.framework
      - sdk: AVFoundation.framework

  # Standalone unit-test bundle: compiles the pure-value sources
  # directly, so tests run without launching the app.
  CamControlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CamControlTests
      - path: CamControl/UVC/UVC.swift
      - path: CamControl/UVC/CameraDescriptor.swift
      - path: CamControl/UVC/CameraKey.swift
      - path: CamControl/UVC/UVCControlTypes.swift
      - path: CamControl/Model/ControlModel.swift
      - path: CamControl/Model/ControlCatalog.swift
      - path: CamControl/Model/ControlUIState.swift
      - path: CamControl/Model/ProfileStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.codecrete.CamControlTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  CamControl:
    build:
      targets:
        CamControl: all
    run:
      config: Debug
  CamControlTests:
    build:
      targets:
        CamControlTests: [test]
    test:
      config: Debug
      targets:
        - CamControlTests
